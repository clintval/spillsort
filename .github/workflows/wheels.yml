name: wheels

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: 0.12.20

jobs:
  build-wheels:
    name: build-wheels (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read  # to check out the repository
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: manylinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: manylinux-aarch64, runner: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, runner: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64, manylinux: "" }
          - { name: macos-arm64, runner: macos-15, target: aarch64, manylinux: "" }
          - { name: windows-x86_64, runner: windows-latest, target: x64, manylinux: "" }
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist
          sccache: "false"

      - name: Install free-threaded Python 3.14 to build against
        if: ${{ matrix.platform.manylinux == '' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14t"

      - name: Build the free-threaded wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist --interpreter python3.14t
          sccache: "false"

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spillsort-wheel-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error

  verify-wheels:
    name: verify-wheels (${{ matrix.platform.name }}, ${{ matrix.python-version }})
    needs: build-wheels
    runs-on: ${{ matrix.platform.runner }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14", "3.14t"]
        platform:
          - { name: manylinux-x86_64, runner: ubuntu-latest, alpine: false }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm, alpine: false }
          - { name: musllinux-x86_64, runner: ubuntu-latest, alpine: true }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, alpine: true }
          - { name: macos-x86_64, runner: macos-15-intel, alpine: false }
          - { name: macos-arm64, runner: macos-15, alpine: false }
          - { name: windows-x86_64, runner: windows-latest, alpine: false }
        exclude:
          - python-version: "3.14t"
            platform: { name: musllinux-x86_64, runner: ubuntu-latest, alpine: true }
          - python-version: "3.14t"
            platform: { name: musllinux-aarch64, runner: ubuntu-24.04-arm, alpine: true }
    steps:
      - name: Download the wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spillsort-wheel-${{ matrix.platform.name }}
          path: dist/

      - name: Write the smoke test
        shell: bash
        run: |
          cat > smoke.py <<'PY'
          import io
          import sys
          import sysconfig
          import tempfile

          import spillsort

          items = [(index * 7919) % 10_000 for index in range(10_000)]
          with spillsort.Sorter(lambda item: -item, max_bytes=4096, tmp_dir=tempfile.mkdtemp()) as sorter:
              assert list(sorter.sort(items)) == sorted(items, reverse=True)
          with spillsort.Sorter() as sorter:
              sorter.add_encoded(2**80, b"b\n")
              sorter.add_encoded(1.5, b"a\n")
              out = io.BytesIO()
              sorter.write_to(out)
          assert out.getvalue() == b"a\nb\n"
          if sysconfig.get_config_var("Py_GIL_DISABLED"):
              assert not sys._is_gil_enabled(), "importing spillsort enabled the GIL"
          print("spillsort", "works")
          PY

      - name: Install uv
        if: ${{ !matrix.platform.alpine }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Install the wheel and run the smoke test
        if: ${{ !matrix.platform.alpine }}
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          case "$PYTHON_VERSION" in
            *t) wheel=(dist/*-cp314t-*.whl) ;;
            *) wheel=(dist/*-abi3-*.whl) ;;
          esac
          uv venv --python "$PYTHON_VERSION" .venv
          uv pip install --python .venv "${wheel[@]}"
          uv run --no-project --python .venv python -P smoke.py

      - name: Install the wheel and run the smoke test on Alpine
        if: ${{ matrix.platform.alpine }}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          docker run --rm --volume "$PWD:/work" --workdir /work "python:${PYTHON_VERSION}-alpine" \
            sh -c 'pip install --root-user-action=ignore dist/*-abi3-*.whl && python -P smoke.py'
