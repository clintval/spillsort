[package]
name = "spillsort"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
authors = ["Clint Valentine <valentine.clint@gmail.com>"]
license = "MIT"
description = "Sort more records than fit in memory: sorted runs spill to disk and merge as they are read"
repository = "https://github.com/clintval/spillsort"
documentation = "https://docs.rs/spillsort"
readme = "README.md"
keywords = ["sort", "external-sort", "merge", "spill", "python"]
categories = ["algorithms"]
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/NOTICE"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
crc32fast = "1.5"
lz4_flex = { version = "0.14", default-features = false, features = ["safe-decode", "safe-encode", "std"] }
pyo3 = { version = "0.29", features = ["abi3-py311"], optional = true }
rayon = "1.11"
tempfile = "3"

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
decimal_bitwise_operands = "allow"
single_match_else = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
